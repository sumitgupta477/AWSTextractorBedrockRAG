# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Regression eval for the deployed RAG pipeline (Textract -> chunking ->
# Bedrock Knowledge Base -> RetrieveAndGenerate). Sends each question in
# tests.yaml to the live /query API and scores:
#   correctness       - key fact from the document appears in the answer
#   faithfulness      - answer is supported by the retrieved chunks (LLM judge)
#   citations         - answer cites the source document
#   no_hallucination  - unanswerable questions are declined, not invented (LLM judge)
#
# drift_check.py compares these scores with evals/baseline.json.

description: Textract + Bedrock RAG - answer quality and grounding

prompts:
  - "{{query}}"

providers:
  - id: file://provider.js
    label: rag-api

defaultTest:
  options:
    # Judge model for llm-rubric and context-faithfulness, on Bedrock so the
    # eval only needs AWS credentials. Pinned so scores don't shift when the
    # judge changes. Override with EVAL_GRADER (any promptfoo provider ID,
    # e.g. bedrock:us.amazon.nova-pro-v1:0 for an inference profile).
    provider: "{{ env.EVAL_GRADER or 'bedrock:amazon.nova-pro-v1:0' }}"

tests: file://tests.yaml

evaluateOptions:
  # Low concurrency to stay under Bedrock and API Gateway throttling limits.
  maxConcurrency: 2
